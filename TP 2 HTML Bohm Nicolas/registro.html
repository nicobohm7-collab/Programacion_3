<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Formulario de Registro</h1>

    <form action="#" method="POST">
        <!-- 1. Nombre completo -->
        <p>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre_completo" required placeholder="Ej: Juan Pérez" tabindex="1">
        </p>

        <!-- 2. Correo electrónico -->
        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="correo_electronico" required placeholder="Ej: correo@ejemplo.com" tabindex="2">
        </p>

        <!-- 3. Contraseña -->
        <p>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="contrasena" required placeholder="Mínimo 8 caracteres" tabindex="3">
        </p>

        <!-- 4. Selección de género -->
        <fieldset>
            <legend>Género:</legend>
            <input type="radio" id="genero_m" name="genero" value="Masculino" tabindex="4">
            <label for="genero_m">Masculino</label><br>

            <input type="radio" id="genero_f" name="genero" value="Femenino" tabindex="5">
            <label for="genero_f">Femenino</label><br>

            <input type="radio" id="genero_otro" name="genero" value="Otro" tabindex="6">
            <label for="genero_otro">Otro</label>
        </fieldset>

        <!-- 5. Intereses -->
        <fieldset>
            <legend>Intereses:</legend>
            <input type="checkbox" id="interes_musica" name="intereses" value="Musica" tabindex="7">
            <label for="interes_musica">Música</label><br>

            <input type="checkbox" id="interes_deporte" name="intereses" value="Deporte" tabindex="8">
            <label for="interes_deporte">Deporte</label><br>

            <input type="checkbox" id="interes_lectura" name="intereses" value="Lectura" tabindex="9">
            <label for="interes_lectura">Lectura</label><br>

            <input type="checkbox" id="interes_tecnologia" name="intereses" value="Tecnologia" tabindex="10">
            <label for="interes_tecnologia">Tecnología</label>
        </fieldset>

        <!-- 6. País -->
        <p>
            <label for="pais">País:</label><br>
            <select id="pais" name="pais" required tabindex="11">
                <option value="" disabled selected>Seleccione un país</option>
                <option value="Argentina">Argentina</option>
                <option value="Brasil">Brasil</option>
                <option value="Chile">Chile</option>
            </select>
        </p>

        <!-- 7. Comentarios adicionales -->
        <p>
            <label for="comentarios">Comentarios adicionales:</label><br>
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Escribe tus comentarios aquí..." tabindex="12"></textarea>
        </p>

        <!-- 8. Botón de envío -->
        <p>
            <input type="submit" value="Registrarse" tabindex="13">
        </p>
    </form>

</body>
</html>
