<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP2: Maquetación de Tarjetas de Productos</title>
    <link rel="stylesheet" href="productos.css">
</head>
<body>

    <header>
        <h1>Galería de Productos</h1>
    </header>

    <main class="galeria">
        <!-- Tarjeta de Producto 1 -->
        <div class="tarjeta-producto">
            <div class="imagen-producto img-1"></div>
            <h3 class="titulo-producto">Auriculares Pro</h3>
            <p class="descripcion-producto">Auriculares inalámbricos con cancelación de ruido y gran autonomía.</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- Tarjeta de Producto 2 -->
        <div class="tarjeta-producto">
            <div class="imagen-producto img-2"></div>
            <h3 class="titulo-producto">Teclado Mecánico</h3>
            <p class="descripcion-producto">Teclado gamer con iluminación RGB y switches azules de alta precisión.</p>
            <button class="btn-comprar">Comprar</button>
        </div>
    </main>

</body>
</html>
